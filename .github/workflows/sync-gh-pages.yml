name: Sync GitHub Pages from avid-panel-miniapp

# Triggered by a repository_dispatch event sent from avid-panel-miniapp's
# sync-release-to-panel workflow once a new release has been mirrored.
# Can also be run manually via workflow_dispatch for re-syncs.
on:
  repository_dispatch:
    types: [sync-gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-gh-pages:
    name: Sync docs/ from avid-panel-miniapp
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout this repo (momentsLab-avid-panel) ───────────────────────
      - name: Checkout this repository
        uses: actions/checkout@v4

      # ── 2. Rebuild releases.json from this repo's own releases ──────────────
      #    Releases are already mirrored here by sync-release, so we source the
      #    JSON from momentsLab-avid-panel itself rather than the private origin.
      - name: Rebuild releases.json
        env:
          GITHUB_TOKEN: ${{ secrets.GH_EXPLOIT_TOKEN }}
        run: |
          echo "Fetching all releases from ${{ github.repository }}…"
          mkdir -p docs
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            > docs/releases.json
          echo "releases.json updated ($(jq length docs/releases.json) entries)"

      # ── 3. Commit and push if anything changed ───────────────────────────────
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GH_EXPLOIT_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/releases.json
          git diff --cached --quiet && echo "No changes to releases.json – skipping." && exit 0

          SOURCE_SHA="${{ github.event.client_payload.head_sha }}"
          git commit -m "chore: sync releases.json from avid-panel-miniapp@${SOURCE_SHA:-manual}"
          git push
          echo "✅ releases.json synced successfully"
